# @syncended/dsh-codex bundle patch.
#
# Two layers:
#   1. Declare the `openai-codex` route on llm-pi-ai's composition base, so
#      Codex models appear with no manual `dsh settings set` step. The route
#      deliberately declares no `models` list: a configured `models` list in
#      dsh-llm-pi-ai *replaces* the installed pi-ai catalog instead of
#      extending it, which would freeze the Codex catalog at this package's
#      release. Without it, every Codex model the installed pi-ai catalog
#      ships is served immediately, and the plugin then overwrites `models`
#      at runtime with OpenAI's live Codex catalog, so models pi-ai has not
#      shipped yet (for example gpt-6-sol) appear too. The user's settings.yaml
#      still layers over this and wins on conflict.
#   2. Register this plugin so it is active when dsh boots.  The user's own
#      cordis.patch.yml and any other bundle layers can patch these rows
#      further by id ("llm-pi-ai", "openai-codex").
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai-codex:
        displayName: OpenAI Codex
        apiKeyEnv: OPENAI_CODEX_TOKEN
        defaultMaxTokens: 128000
- insert:
    - id: openai-codex
      name: "@syncended/dsh-codex"
      config:
        # OpenAI keeps listing gpt-6-astra after gpt-6-sol/gpt-6-luna shipped
        # (its `upgrade` is null), but this deployment only wants the current
        # cohort. Remove the entry to offer Astra again; the catalog's own
        # `upgrade` markers retire superseded models without configuration.
        modelCatalogExclude:
          - gpt-6-astra
